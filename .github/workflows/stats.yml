name: Update stats cards

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMMON: username=${{ github.repository_owner }}&hide_border=true&bg_color=00000000&include_all_commits=true&count_private=true
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&show_icons=true&theme=default&title_color=0969da&icon_color=0969da
          path: profile/stats-light.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.COMMON }}&show_icons=true&theme=github_dark&title_color=58a6ff&icon_color=58a6ff
          path: profile/stats-dark.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.COMMON }}&layout=compact&langs_count=8&theme=default&title_color=0969da
          path: profile/langs-light.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.COMMON }}&layout=compact&langs_count=8&theme=github_dark&title_color=58a6ff
          path: profile/langs-dark.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh stats cards" || exit 0
          git push
